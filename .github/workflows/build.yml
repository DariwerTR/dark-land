name: build

# Manual build only: runs when you press "Run workflow" in the Actions tab.
# No releases or publishing.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Gradle wrapper jar is not committed yet, so Gradle is installed here.
      # Once `gradle wrapper` has been run and committed, this can become ./gradlew build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: cursed-lands
          path: build/libs/*.jar
